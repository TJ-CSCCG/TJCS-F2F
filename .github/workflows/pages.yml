# This is a basic workflow to help you get started with Actions

name: Pages

# Controls when the workflow will run
# Builds and deploys the site to GitHub Pages from main only; it used to deploy
# on every push and pull request, which published unreviewed changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # The theme's footer uses _internal/google_analytics_async.html, which Hugo
          # removed in 0.125.0; pinned to the last release that has it.
          hugo-version: '0.124.1'

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
